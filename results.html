<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Results · Market Returns</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        .results-container {
            padding: 1.5rem 0;
        }
        
        .round-results {
            background: white;
            border-radius: 1.5rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid #e2ebf3;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .round-results h3 {
            color: #0b2a42;
            margin-bottom: 1rem;
            font-size: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .round-results .year-badge {
            background: #0b6e3f;
            color: white;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        
        .market-returns-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 0.8rem;
            margin-top: 0.8rem;
        }
        
        .return-item {
            background: #f8fbfe;
            padding: 0.6rem 1rem;
            border-radius: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #e8eef6;
        }
        
        .return-item .asset-name {
            font-weight: 500;
            color: #1a3b55;
            font-size: 0.85rem;
        }
        
        .return-item .return-value {
            font-weight: 700;
            font-size: 0.9rem;
        }
        
        .return-item .return-value.positive { color: #0b6e3f; }
        .return-item .return-value.negative { color: #b22234; }
        
        .no-data {
            text-align: center;
            color: #6b8a9e;
            padding: 3rem;
            font-size: 1.1rem;
        }
        
        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .stat-card {
            background: white;
            padding: 1.2rem;
            border-radius: 1.2rem;
            border: 1px solid #e2ebf3;
            text-align: center;
        }
        
        .stat-card .stat-label {
            color: #6b8a9e;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        
        .stat-card .stat-value {
            font-size: 1.6rem;
            font-weight: 700;
            color: #0b2a42;
            margin-top: 0.3rem;
        }
        
        .stat-card .stat-value.positive { color: #0b6e3f; }
        .stat-card .stat-value.negative { color: #b22234; }
        
        .return-summary {
            margin-bottom: 0.5rem;
            padding: 0.5rem 1rem;
            background: #eef5fc;
            border-radius: 0.8rem;
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            font-size: 0.9rem;
        }
        
        .return-summary span { font-weight: 500; }
        
        .refresh-btn {
            background: #1f3a57;
            border: none;
            color: white;
            font-weight: 600;
            padding: 0.4rem 1.2rem;
            border-radius: 60px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.1s;
            margin-bottom: 1rem;
        }
        
        .refresh-btn:hover {
            background: #0b2a44;
            transform: scale(0.97);
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        
        .news-signals {
            background: #f3f8fe;
            border-radius: 1rem;
            padding: 0.8rem 1.2rem;
            margin: 0.8rem 0 1rem 0;
            border-left: 4px solid #2563eb;
        }
        
        .news-signals .signal {
            font-size: 0.85rem;
            color: #1a3b55;
            padding: 0.15rem 0;
            line-height: 1.5;
        }
        
        .news-signals .signal::before {
            content: "📰 ";
        }
        
        .performance-highlights {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
            margin: 0.8rem 0;
        }
        
        .performance-highlights .best {
            background: #ecfdf5;
            padding: 0.4rem 1rem;
            border-radius: 0.8rem;
            border-left: 4px solid #059669;
        }
        
        .performance-highlights .worst {
            background: #fef2f2;
            padding: 0.4rem 1rem;
            border-radius: 0.8rem;
            border-left: 4px solid #dc2626;
        }
        
        .performance-highlights .label {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: #6b8a9e;
            font-weight: 600;
        }
        
        .performance-highlights .value {
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .group-header {
            background: linear-gradient(135deg, #1f3a57, #2a4a6a);
            color: white;
            padding: 1.5rem 2rem;
            border-radius: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .group-header h2 {
            font-size: 1.8rem;
            margin-bottom: 0.3rem;
        }
        
        .group-header p {
            opacity: 0.9;
            font-size: 1rem;
        }
        
        .group-themes {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin-top: 0.8rem;
        }
        
        .group-themes .theme {
            background: rgba(255,255,255,0.15);
            padding: 0.3rem 1rem;
            border-radius: 30px;
            font-size: 0.85rem;
        }
        
        .no-rounds-message {
            text-align: center;
            padding: 3rem 1rem;
            background: #f8fbfe;
            border-radius: 1.5rem;
            border: 2px dashed #dce6f0;
        }
        
        .no-rounds-message .big-emoji {
            font-size: 4rem;
            display: block;
            margin-bottom: 1rem;
        }
        
        .no-rounds-message h3 {
            color: #0b2a42;
            margin-bottom: 0.5rem;
        }
        
        .no-rounds-message p {
            color: #6b8a9e;
        }
        
        .remaining-rounds-message {
            text-align: center;
            padding: 1.5rem;
            background: #f8fbfe;
            border-radius: 1.5rem;
            border: 1px dashed #dce6f0;
            margin-top: 1rem;
        }
        
        .remaining-rounds-message p {
            color: #6b8a9e;
        }
        
        .no-data {
            text-align: center;
            color: #6b8a9e;
            padding: 3rem;
            font-size: 1.1rem;
        }

        .no-data .big-emoji {
            font-size: 4rem;
            display: block;
            margin-bottom: 1rem;
        }
        
        @media (max-width: 700px) {
            .performance-highlights {
                grid-template-columns: 1fr;
            }
            .market-returns-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
            .group-header {
                padding: 1rem;
            }
            .group-header h2 {
                font-size: 1.3rem;
            }
            .summary-stats {
                grid-template-columns: 1fr 1fr;
            }
        }
        
        @media (max-width: 480px) {
            .summary-stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Navigation Bar -->
        <div class="nav-bar">
            <a href="instructions.html">📖 Instructions</a>
            <a href="asset-info.html">📚 Asset Info</a>
            <a href="index.html">🏠 Game</a>
            <a href="results.html" class="active">📊 Results</a>
            <a href="portfolio.html">📈 Portfolio</a>
        </div>

        <div class="results-header">
            <div>
                <h1>📊 Your Round Results</h1>
                <div class="sub">See your performance for each completed round</div>
            </div>
            <button class="refresh-btn" id="refreshBtn">🔄 Refresh</button>
        </div>

        <div id="resultsContainer" class="results-container">
            <!-- Rendered by JavaScript -->
        </div>

        <div class="footnote">Only completed rounds are shown here · returns are revealed after each submission</div>
    </div>

    <script>
        // Complete Group A Data - 6 Rounds, 6 Assets (Years hidden - just show labels)
        const GROUP_A_DATA = {
            "2008": { 
                theme: "Global financial crisis", 
                label: "Round 1", 
                newsSignals: [
                    "Emergency policy support is discussed",
                    "Investors rush toward defensive assets",
                    "Confidence in major institutions weakens"
                ], 
                best: "Gold", 
                worst: "China EQ", 
                returns: { "US EQ": -37.0, "Europe EQ": -45.0, "China EQ": -65.4, "Global Bonds": 5.2, "Gold": 5.5, "Cash": 1.4 } 
            },
            "2017": { 
                theme: "Growth optimism", 
                label: "Round 2", 
                newsSignals: [
                    "Global economic data improves",
                    "Equity valuations continue climbing",
                    "Some investors warn of complacency"
                ], 
                best: "China EQ", 
                worst: "Cash", 
                returns: { "US EQ": 21.8, "Europe EQ": 25.0, "China EQ": 54.1, "Global Bonds": 7.4, "Gold": 13.7, "Cash": 0.8 } 
            },
            "2020": { 
                theme: "Pandemic shock", 
                label: "Round 3", 
                newsSignals: [
                    "A global health crisis disrupts production and travel",
                    "Governments prepare extraordinary support",
                    "Markets struggle to assess long-term impact"
                ], 
                best: "China EQ", 
                worst: "Cash", 
                returns: { "US EQ": 18.4, "Europe EQ": 5.0, "China EQ": 29.5, "Global Bonds": 9.2, "Gold": 24.6, "Cash": 0.6 } 
            },
            "2012": { 
                theme: "Stabilisation", 
                label: "Round 4", 
                newsSignals: [
                    "Central banks hint at additional support",
                    "Investors cautiously re-enter risk assets",
                    "Economic stability remains debated"
                ], 
                best: "Europe EQ", 
                worst: "Cash", 
                returns: { "US EQ": 16.0, "Europe EQ": 19.0, "China EQ": 14.3, "Global Bonds": 4.2, "Gold": 7.1, "Cash": 0.1 } 
            },
            "2022": { 
                theme: "Inflation and tightening", 
                label: "Round 5", 
                newsSignals: [
                    "Inflation repeatedly surprises policy makers",
                    "Bond markets reprice interest-rate expectations",
                    "Growth assets face valuation pressure"
                ], 
                best: "Cash", 
                worst: "China EQ", 
                returns: { "US EQ": -18.1, "Europe EQ": -15.0, "China EQ": -21.8, "Global Bonds": -16.2, "Gold": 0.4, "Cash": 2.1 } 
            },
            "2024": { 
                theme: "Momentum vs diversification", 
                label: "Round 6", 
                newsSignals: [
                    "Innovation optimism expands further",
                    "Markets question whether leadership is too concentrated",
                    "Policy easing expectations rise"
                ], 
                best: "Gold", 
                worst: "Global Bonds", 
                returns: { "US EQ": 24.2, "Europe EQ": 9.0, "China EQ": 16.4, "Global Bonds": 2.8, "Gold": 27.4, "Cash": 5.1 } 
            }
        };

        // Order of rounds (just the keys, years are hidden in display)
        const ROUND_ORDER = ["2008", "2017", "2020", "2012", "2022", "2024"];

        function loadResults() {
            const container = document.getElementById('resultsContainer');
            
            // Get history from localStorage
            let history = [];
            const gameDataStr = localStorage.getItem('gameData');
            if (gameDataStr) {
                try {
                    const gameData = JSON.parse(gameDataStr);
                    history = gameData.history || [];
                } catch(e) {}
            }
            
            if (history.length === 0) {
                const historyStr = localStorage.getItem('gameHistory');
                if (historyStr) {
                    try {
                        history = JSON.parse(historyStr);
                    } catch(e) {}
                }
            }

            // If no history, show empty state
            if (history.length === 0) {
                container.innerHTML = `
                    <div class="no-data">
                        <span class="big-emoji">📭</span>
                        <h3>No Results Yet</h3>
                        <p>Complete your first round in the Game tab to see results here!</p>
                        <p style="margin-top:0.5rem; color:#2563eb;">
                            <a href="index.html" style="color:#2563eb; text-decoration:underline;">→ Go to Game</a>
                        </p>
                    </div>
                `;
                return;
            }

            // Calculate summary stats
            const totalRounds = history.length;
            const finalCapital = history[history.length - 1]?.newCapital || 10000;
            const totalReturn = finalCapital - 10000;
            const totalReturnPct = ((finalCapital / 10000) - 1) * 100;

            let html = `
                <div class="group-header">
                    <h2>🎯 Fear vs Opportunity</h2>
                    <p>Your performance across ${totalRounds} completed round${totalRounds > 1 ? 's' : ''}</p>
                    <div class="group-themes">
                        <span class="theme">📉 Reaction to Crisis</span>
                        <span class="theme">📈 Ability to buy after fear</span>
                        <span class="theme">💪 Confidence after gains</span>
                    </div>
                </div>
            `;

            // Summary stats
            html += `
                <div class="summary-stats">
                    <div class="stat-card">
                        <div class="stat-label">📊 Rounds Completed</div>
                        <div class="stat-value">${totalRounds} / 6</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">💰 Final Capital</div>
                        <div class="stat-value">$${finalCapital.toFixed(2)}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">📈 Total Return</div>
                        <div class="stat-value ${totalReturn >= 0 ? 'positive' : 'negative'}">
                            ${totalReturn >= 0 ? '+' : ''}$${totalReturn.toFixed(2)}
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">📈 Return %</div>
                        <div class="stat-value ${totalReturnPct >= 0 ? 'positive' : 'negative'}">
                            ${totalReturnPct >= 0 ? '+' : ''}${totalReturnPct.toFixed(2)}%
                        </div>
                    </div>
                </div>
            `;

            // Show completed rounds - NO YEARS displayed
            history.forEach((h, index) => {
                const roundNum = index + 1;
                const year = h.year;
                const data = GROUP_A_DATA[year] || null;
                const returns = h.returns || {};
                
                html += `
                    <div class="round-results">
                        <h3>
                            <span>Round ${roundNum} ${data ? '· ' + data.theme : ''}</span>
                            <span class="year-badge">✅ Revealed</span>
                        </h3>
                        
                        ${data ? `
                            <div class="news-signals">
                                <div class="signal">${data.newsSignals[0]}</div>
                                <div class="signal">${data.newsSignals[1]}</div>
                                <div class="signal">${data.newsSignals[2]}</div>
                            </div>
                            
                            <div class="performance-highlights">
                                <div class="best">
                                    <div class="label">🏆 Best Performance</div>
                                    <div class="value">${data.best}</div>
                                </div>
                                <div class="worst">
                                    <div class="label">📉 Worst Performance</div>
                                    <div class="value">${data.worst}</div>
                                </div>
                            </div>
                        ` : ''}
                        
                        <div class="return-summary">
                            <span>💰 Your Return: ${h.returnAmount >= 0 ? '+' : ''}$${h.returnAmount?.toFixed(2) || '0.00'}</span>
                            <span>📈 Your Return %: ${h.returnPercent >= 0 ? '+' : ''}${h.returnPercent?.toFixed(2) || '0.00'}%</span>
                            <span>🔁 New Capital: $${h.newCapital?.toFixed(2) || 'N/A'}</span>
                        </div>
                        
                        <div class="market-returns-grid">
                    `;
                
                // Show all asset returns
                const sortedAssets = Object.keys(returns).sort();
                sortedAssets.forEach(asset => {
                    const ret = returns[asset];
                    const sign = ret >= 0 ? '+' : '';
                    const className = ret >= 0 ? 'positive' : 'negative';
                    html += `
                        <div class="return-item">
                            <span class="asset-name">${asset}</span>
                            <span class="return-value ${className}">${sign}${ret.toFixed(1)}%</span>
                        </div>
                    `;
                });
                
                html += `
                        </div>
                    </div>
                `;
            });

            // Remaining rounds message
            const remaining = 6 - history.length;
            if (remaining > 0) {
                const nextRoundNum = history.length + 1;
                html += `
                    <div class="remaining-rounds-message">
                        <p>
                            🔒 ${remaining} round${remaining > 1 ? 's' : ''} remaining — 
                            <a href="index.html" style="color:#2563eb; text-decoration:underline;">continue playing in the Game tab</a>
                            ${remaining === 1 ? ` (Round ${nextRoundNum} is next!)` : ''}
                        </p>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        // Load data when page loads
        document.addEventListener('DOMContentLoaded', loadResults);
        
        // Listen for storage changes
        window.addEventListener('storage', function(e) {
            if (e.key === 'gameData' || e.key === 'gameHistory' || e.key === 'allRoundReturns' || e.key === 'gameReset') {
                console.log('🔄 Data updated, refreshing results...');
                loadResults();
            }
        });
        
        // Manual refresh button
        document.getElementById('refreshBtn').addEventListener('click', function() {
            loadResults();
            this.textContent = '✅ Refreshed!';
            setTimeout(() => {
                this.textContent = '🔄 Refresh';
            }, 1500);
        });
        
        // Check for reset every 2 seconds
        let lastResetTime = localStorage.getItem('gameReset') || '0';
        setInterval(() => {
            const currentReset = localStorage.getItem('gameReset') || '0';
            if (currentReset !== lastResetTime) {
                lastResetTime = currentReset;
                console.log('🔄 Reset detected, refreshing results...');
                loadResults();
            }
        }, 2000);
    </script>
</body>
</html>
